<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Write a Chapter | StoryVerse</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <header class="top-bar">
      <a class="site-name" href="{{ url_for('home') }}">
        StoryVerse<span class="brand-dot">.</span>
      </a>
      <div class="account-area">
        <span>Hi, {{ session.get("username") }}</span>
        <a class="header-register" href="{{ url_for('logout') }}">Log out</a>
      </div>
    </header>

    <main class="page-content writing-dashboard">
      <section class="writing-intro">
        <span class="section-kicker">YOUR STORY</span>
        <h1>Write a chapter</h1>
        <p>Story: {{ story["title"] }}</p>
      </section>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <p class="flash-message {{ category }}">{{ message }}</p>
      {% endfor %} {% endif %} {% endwith %}

      <section class="stories-section">
        <form
          method="POST"
          action="{{ url_for('create_chapter', story_id=story['id']) }}"
          class="story-form"
        >
          <label for="title">Chapter title *</label>
          <input
            type="text"
            id="title"
            name="title"
            maxlength="150"
            required
            placeholder="e.g. Chapter One: The Beginning"
          />

          <label for="content">Chapter content *</label>
          <textarea
            id="content"
            name="content"
            rows="18"
            required
            placeholder="Start writing your story here..."
          ></textarea>

          <div class="form-actions">
            <button type="submit" class="header-register">
              Save chapter draft
            </button>
            <a href="{{ url_for('writing_dashboard') }}">Cancel</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
